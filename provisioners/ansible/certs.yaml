---
- hosts: all
  become: yes
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  vars:
    cert_generated: "{{ cert_generated }}"
    pkcs1_generated: "{{ pkcs1_generated }}"
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Check pip3 exists
      command: pip3 --version
      register: pip3_exist
      ignore_errors: True
      changed_when: false

    - name: Check python3 version
      command: python3 --version
      register: python3_version
      changed_when: false

    - name: Set python3 version fact
      set_fact:
        python3_major_minor: "{{ python3_version.stdout.split()[1] | regex_replace('^(\\d+\\.\\d+).*$', '\\1') }}"

    - name: Install python3-pip from apt (Ubuntu 20.04+ / Debian 11+)
      apt:
        name: python3-pip
        state: present
        update_cache: yes
      when:
        - pip3_exist is failed
        - ansible_facts['os_family'] == "Debian"

    - name: Re-check pip3 exists after apt install
      command: pip3 --version
      register: pip3_after_apt
      ignore_errors: True
      changed_when: false
      when: pip3_exist is failed

    - name: Install python3-distutils from apt (for version-specific get-pip.py support)
      apt:
        name: python3-distutils
        state: present
        update_cache: yes
      when:
        - pip3_exist is failed
        - pip3_after_apt is failed
        - ansible_facts['os_family'] == "Debian"

    - name: Download version-specific get-pip.py
      get_url:
        url: "https://bootstrap.pypa.io/pip/{{ python3_major_minor }}/get-pip.py"
        dest: /tmp/get-pip.py
        mode: 0755
      when:
        - pip3_exist is failed
        - pip3_after_apt is failed

    - name: Check get-pip.py downloaded
      stat:
        path: /tmp/get-pip.py
      register: stat_pip_result
      when:
        - pip3_exist is failed
        - pip3_after_apt is failed

    - name: Install pip via version-specific get-pip.py
      command: python3 /tmp/get-pip.py
      register: pip_install
      when:
        - pip3_exist is failed
        - pip3_after_apt is failed
        - stat_pip_result.stat.exists

    - name: Debug pip install result
      debug:
        msg: "pip has been installed"
      when: (pip_install is succeeded) or (pip3_exist is succeeded) or (pip3_after_apt is succeeded)

    - name: Install python3-openssl from apt (Debian/Ubuntu)
      apt:
        name: python3-openssl
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install python-openssl via pip (non-Debian)
      pip:
        name: pyOpenSSL
        executable: pip3
      when: ansible_facts['os_family'] != "Debian"

    - name: Generate the CA private key
      openssl_privatekey:
        path: "{{ certs_path }}/{{ common_name | replace('.', '-') }}-ca-key.pem"

    - stat: path={{ certs_path }}/{{ common_name | replace('.', '-') }}-ca.crt
      register: ca_crt_file

    - name: Generate a Self Signed CA certificate
      shell: openssl req -x509 -new -nodes -key {{ common_name | replace('.', '-') }}-ca-key.pem -days {{ ca_days }} -out {{ common_name | replace('.', '-') }}-ca.crt -subj "/CN={{ common_name | replace('.', '-') }}-ca"
      args:
        chdir: "{{ certs_path }}"
      when: ca_crt_file.stat.exists == False

    - name: Generate the {{ common_name }} private key
      openssl_privatekey:
        path: "{{ certs_path }}/{{ common_name | replace('.', '-') }}-key.pem"
      when: cert_generated

    - name: Generate the {{ common_name }} certificate signing request (CSR)
      openssl_csr:
        path: "{{ certs_path }}/{{ common_name | replace('.', '-') }}.csr"
        privatekey_path: "{{ certs_path }}/{{ common_name | replace('.', '-') }}-key.pem"
        common_name: "{{ common_name }}"
        subject_alt_name: "{{ item.value | map('regex_replace', '^', 'DNS:') | list }}"
      with_dict:
        alt_names: "{{ alt_names }}"
      when: cert_generated

    - name: Generate the {{ common_name }} certificate signed by the self-signed CA
      openssl_certificate:
        path: "{{ certs_path }}/{{ common_name | replace('.', '-') }}.crt"
        csr_path: "{{ certs_path }}/{{ common_name | replace('.', '-') }}.csr"
        ownca_path: "{{ certs_path }}/{{ common_name | replace('.', '-') }}-ca.crt"
        ownca_privatekey_path: "{{ certs_path }}/{{ common_name | replace('.', '-') }}-ca-key.pem"
        ownca_not_after: "+{{ cert_days }}d"
        provider: ownca
      when: cert_generated

    - name: Generate the PKCS#1 file for {{ common_name }}
      shell: openssl rsa -in {{ common_name | replace('.', '-') }}-ca-key.pem -out {{ common_name | replace('.', '-') }}-ca.key
      args:
        chdir: "{{ certs_path }}"
      when: pkcs1_generated
